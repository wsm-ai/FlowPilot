services:
  flowpilot-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowpilot:stage13b
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      MCP_SERVERS: "${MCP_SERVERS:-[]}"
    ports:
      - "127.0.0.1:8000:8000"
