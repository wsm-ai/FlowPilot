services:
  flowpilot-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowpilot:stage13b
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      MCP_SERVERS: "${MCP_SERVERS:-[]}"
      FLOWPILOT_AUTH_ENABLED: "${FLOWPILOT_AUTH_ENABLED:-true}"
      FLOWPILOT_API_KEY: "${FLOWPILOT_API_KEY:?FLOWPILOT_API_KEY must be set}"
      FLOWPILOT_API_KEYS: '${FLOWPILOT_API_KEYS:-[]}'
      FLOWPILOT_MAX_REQUEST_BODY_BYTES: "${FLOWPILOT_MAX_REQUEST_BODY_BYTES:-1048576}"
    volumes:
      - flowpilot_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); data = json.load(response); response.close(); assert response.status == 200 and data == {'status': 'ok', 'service': 'FlowPilot'}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  flowpilot_data:
